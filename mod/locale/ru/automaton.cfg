[technology-description]
automaton-radio=Машины обмениваются сообщениями на любом расстоянии и делят работу через доску и очереди задач.
automaton-display=Пиксельное табло, на которое программы выводят что угодно.
automaton-tuning=Машины сами выбирают рецепт сборщиков.
automaton-fluids=Машины возят жидкости в баке: воду из озёр, нефть из месторождений.
automaton-construction=Машины строят, разбирают и поворачивают здания.
automaton-circuits=Метки подключаются проводами: программы читают и пишут сигналы.
automaton-sensors=Машины видят дальше.
automaton-mk2=Электрическая модель: быстрее, больше груз и память, заряжается на станции.
automaton-mk3=Лучшая наземная модель.
automaton-combat=Машины, которые защищают маршруты и атакуют гнёзда.
automaton-flying=Летают по прямой, не сталкиваясь со зданиями.

automaton-speed=Машины ездят быстрее.
automaton-cargo=Больше слотов груза у всех машин.
automaton-mining=Машины быстрее копают.
automaton-processor=Программы машин исполняют больше инструкций за тик.
automaton-memory=Программам машин доступно больше памяти.
automaton-tank=Больше жидкости в баке.

