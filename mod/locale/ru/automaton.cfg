[mod-name]
automaton=Automaton

[mod-description]
automaton=В разработке.

[mod-setting-name]
automaton-instructions-per-tick=Инструкций программ за тик (на всех)
automaton-show-greeting=Показывать приветствие

[mod-setting-description]
automaton-instructions-per-tick=Общий бюджет инструкций программ машин на тик. Каждая машина получает квант своей модели (Mk1 — 50), пока бюджет не кончится; остальные — в следующий тик. Меньше — игра не тормозит, но машины «думают» медленнее.
automaton-show-greeting=Писать приветствие в чат при входе в игру.

[automaton]
chat=[__1__] __2__
alert=__1__: __2__
name-marker=Имя метки
name-zone=Имя зоны
run-help=Запустить программу на машине. /am-run <номер> <имя программы>
stop-help=Остановить программу машины. /am-stop <номер>
log-help=Последние строки консоли машины. /am-log <номер> [строк]
args-help=Параметры программы машины (JSON). /am-args <номер> {"ore": "iron-ore"}
home-help=«Дом» машины — там, где она стоит. /am-home <номер>
unknown-program=Нет программы «__1__». Опубликуйте её: /c remote.call("automaton", "publish", "имя", [[текст]])
program-started=__1__: запущена «__2__» v__3__.
bad-args=Параметры — JSON: __1__
greeting=Automaton загружен. Привет, __1__!
hello=Automaton работает! Команда вызвана __1__ раз на этой карте.
command-help=Проверить, что мод Automaton работает.
debug-give-help=Отладка: выдать рабочих автоматонов. /am-give [число], по умолчанию 5.
debug-given=Выдано автоматонов: __1__.
debug-admin-only=В мультиплеере отладочные команды — только для админов.
debug-goto-help=Отладка: отправить машины. /am-goto <номер|all> [x y] — к точке; без координат — к зданию под курсором или к вам.
debug-goto-sent=Отправлено машин: __1__.
debug-unknown-robot=Нет машины __1__ на этой поверхности.
debug-info-help=Отладка: состояние машины. /am-info <номер>
debug-say-help=Отладка: облачко с текстом над машиной. /am-say <номер> <текст>
debug-look-help=Отладка: состояние здания под курсором — как его видят программы машин. /am-look
debug-do-help=Отладка: действие машины. /am-do <номер> <wait|mine|take|put|pickup|drop|give|repair|refuel> [предмет] [число]; цель — под курсором.
move-arrived=__1__: на месте.
move-no-path=__1__: пути нет.
move-stuck=__1__: застрял.
move-no-fuel=__1__: кончилось топливо.
action-done=__1__: __2__ — готово: __3__.
action-done-reason=__1__: __2__ — готово: __3__ (__4__).
action-failed=__1__: __2__ — __3__ (сделано: __4__).

