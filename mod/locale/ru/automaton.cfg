[tips-and-tricks-item-description]
automaton-intro=Конвейеров, буров и манипуляторов в этой игре нет — их работу делают [item=automaton-worker-mk1] автоматоны по программам на TypeScript. Поставьте машину и кликните по ней: откроется окно машины. Программы пишет команда: «Программы…» в окне машины → «Новая». Справка по функциям с примерами — F1 или «?» на панели быстрого доступа.
automaton-programs=Окно машины → «Программы…»: редактор на весь экран, номера строк, ошибки подсвечиваются при публикации. Программа общая для команды: опубликуйте новую версию — все машины с ней начнут заново. «Пауза» и «Шаг» помогают найти ошибку; текущая строка видна в окне машины.
automaton-markers=Программы находят места по именам. [item=automaton-marker] Метка — флажок с именем: marker("склад"). «Программатор» (ярлык на панели) выделяет зону: zone("плавильня"), а find("stone-furnace", zone("плавильня")) находит в ней здания. Переименовать метку или табло — /am-name под курсором.
automaton-vscode=Писать программы удобнее в VS Code: подсказки, ошибки до публикации. «Программы…» → «Папка для VS Code», откройте эту папку в VS Code и запускайте игру с параметром --enable-lua-udp 27155 — сохранённый файл сразу публикуется в игре.
automaton-water=Прибрежного насоса нет: воду к котлам возят машины. Исследуйте «Жидкости для автоматонов» (откроется, когда скрафтите котёл), поставьте у котлов резервуар и метку «котельная» и напишите водовоза: pump у воды, drain в резервуар. Один водовоз примерно на котёл.
automaton-team=После «Радиосвязи» машины переписываются (send, receive, request), делят работу через доску (board) и очереди задач (tasks), рисуют на табло. Например, оркестратор раздаёт задания, а рабочие сами его находят (пример — в руководстве игрока).

[automaton-help]
title=Справка
first-steps=Первые шаги
first-steps-text=1. Поставьте автоматон и кликните по нему — откроется окно машины.\n2. «Программы…» → «Новая»: назовите программу, напишите код (пример ниже) и нажмите «Опубликовать». Ошибки видны прямо в строках.\n3. «Назначить машине», затем в окне машины — «Запустить». Что машина печатает (print) — в её консоли.\n\nПрограмма общая для команды: новая версия перезапускает все машины с ней. У каждой машины свои параметры — поле «Параметры» (JSON) в окне машины, в программе — me.args().\nМеста программы находят по именам: метка рядом с сундуком — marker("склад"), зона «Программатором» — zone("плавильня").
first-program=Первая программа — шахтёр:
errors=Частые ошибки
errors-text=Ошибка действия останавливает программу, если её не поймать (try/catch, e.code):\n• out-of-sight — состояние цели не видно: подъехать ближе (move) или спросить машину, которая видит.\n• out-of-reach — цель дальше досягаемости: сначала move к ней.\n• no-path, stuck — пути нет или машина застряла: убрать здания с пути, выбрать другую точку.\n• no-fuel — кончилась энергия: уголь в топливо (refuel) или зарядная станция (Mk2 и выше).\n• cargo-full, target-full, not-enough-items — груз полон, здание полное, предметов не хватает: обычно это повод подождать или ехать дальше.\n• not-researched — функция ещё не открыта исследованием.\n\nОшибки публикации:\n• «тип X не подходит туда, где нужен Y» — аргумент не того типа, проверьте объявление функции здесь же в справке.\n• «== нельзя: используйте ===» — в языке строгие сравнения.\n• Программа «в карантине» раз за разом упиралась в лимиты (память, рекурсия); снимает карантин новая версия.
section-entries=Функции и типы раздела: __1__
section-example=Пример раздела «__1__»:
select-example=Выделить пример
example-selected=Пример выделен: Ctrl+C, затем в редакторе программы — Ctrl+V.
