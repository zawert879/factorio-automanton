[mod-name]
automaton=Automaton

[mod-description]
automaton=Оверхол: конвейеров, буров, манипуляторов, логистических роботов и прибрежного насоса нет — их работу делают программируемые автоматоны. Программы на TypeScript — прямо в игре или в VS Code.

[mod-setting-name]
automaton-publish-rights=Кто может публиковать программы
automaton-instructions-per-tick=Инструкций программ за тик (на всех)
automaton-show-greeting=Показывать приветствие

[mod-setting-description]
automaton-publish-rights=Все игроки или только админы (в одиночной игре — всегда можно).
automaton-instructions-per-tick=Общий бюджет инструкций программ машин на тик. Каждая машина получает квант своей модели (Mk1 — 50), пока бюджет не кончится; остальные — в следующий тик. Меньше — игра не тормозит, но машины «думают» медленнее.
automaton-show-greeting=Писать приветствие в чат при входе в игру.

