[item-description]
automaton-marker=Флажок с именем: программы находят его marker("имя").
automaton-programmer=Рамка левой кнопкой — зона с именем: программы находят её zone("имя"). С Shift — удалить зоны.\nРамка правой кнопкой — выбрать программу всем машинам в рамке. С Shift — остановить их.
automaton-worker-mk1=Заводной рабочий, который выполняет свою программу: добывает, возит и загружает здания.
automaton-worker-mk2=Электрический: быстрее, больше груз, бак и память. Заряжается на станции (charge).
automaton-worker-mk3=Лучшая наземная модель. Заряжается на станции (charge).
automaton-charging-station=Копит энергию из сети и заряжает автоматоны Mk2 и Mk3, которые подъехали к ней (charge).
automaton-display-small=Пиксельный экран 3×2 клетки: программы рисуют на нём с любого расстояния — display("имя").
automaton-display-large=Пиксельный экран 6×4 клетки: программы рисуют на нём с любого расстояния — display("имя").
automaton-signal-marker=Метка, которую можно подключить проводами: программы читают сигналы сети и выставляют свои — signals.read(marker("имя"), "signal-A").
automaton-combat-mk1=Пулемёт на шасси автоматона: охраняет посты и маршруты (attack, guard, patrol). Патроны — reload из груза.
automaton-combat-mk2=Ракетомёт на шасси автоматона: для гнёзд и червей. Ракеты — reload из груза.
automaton-flyer-mk1=Перевозчик: летит по прямой, ни с чем не сталкивается. Не добывает и не возит жидкости. Аккумулятор — заряжается на станции.
automaton-flyer-mk2=Быстрый перевозчик с грузом побольше. Аккумулятор — заряжается на станции.

