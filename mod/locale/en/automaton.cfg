automaton-marker=A named flag: programs find it with marker("name").
automaton-programmer=Select a rectangle to create a named zone: programs find it with zone("name"). With Shift — remove zones.
automaton-worker-mk1=A clockwork worker that follows its program: mines, carries and loads buildings.
automaton-worker-mk2=Electric: faster, more cargo, tank and memory. Recharges at a station (charge).
automaton-worker-mk3=The best ground model. Recharges at a station (charge).
automaton-charging-station=Stores energy from the grid and recharges Mk2 and Mk3 automatons next to it (charge).

