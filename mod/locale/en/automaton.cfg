[tips-and-tricks-item-description]
automaton-intro=There are no belts, drills or inserters in this game — [item=automaton-worker-mk1] automatons do their work by running TypeScript programs. Place a machine and click it to open its window. Your team writes the programs: "Programs…" in the machine window → "New". Examples are in the player guide (github.com/zawert879/factorio-automanton).
automaton-programs=Machine window → Programs…: a full-screen editor with line numbers; errors are highlighted when you publish. A program is shared by the team: publish a new version and every machine running it restarts. Pause and Step help find bugs; the current line is shown in the machine window.
automaton-markers=Programs find places by name. An [item=automaton-marker] marker is a named flag: marker("depot"). The Programmer shortcut selects a zone: zone("smelter"), and find("stone-furnace", zone("smelter")) finds its buildings. Rename a marker or a display with /am-name under the cursor.
automaton-vscode=Writing programs is easier in VS Code: completion and errors before publishing. Programs… → VS Code folder, open that folder in VS Code and start the game with --enable-lua-udp 27155 — a saved file is published in the game right away.
automaton-water=There is no offshore pump: machines carry water to boilers. Research Automaton fluids (unlocked when you craft a boiler), put a storage tank and a marker named "котельная" next to the boilers and write a water carrier: pump at the water, drain into the tank. About one carrier per boiler.
automaton-team=After Automaton radio, machines message each other (send, receive, request), share work through the board and task queues, and draw on displays. For example, an orchestrator hands out orders and workers find it themselves (see the player guide).
