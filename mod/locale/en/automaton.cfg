[mod-name]
automaton=Automaton

[mod-description]
automaton=Work in progress.

[mod-setting-name]
automaton-instructions-per-tick=Program instructions per tick (all robots)
automaton-show-greeting=Show greeting

[mod-setting-description]
automaton-instructions-per-tick=Total instruction budget for robot programs per tick. Each robot gets its model's quantum (Mk1 — 50) until the budget runs out; the rest run next tick.
automaton-show-greeting=Print a greeting in chat when you join the game.

[automaton]
chat=[__1__] __2__
alert=__1__: __2__
name-marker=Marker name
name-zone=Zone name
run-help=Run a program on a robot. /am-run <id> <program name>
stop-help=Stop a robot's program. /am-stop <id>
log-help=Last lines of a robot's console. /am-log <id> [lines]
args-help=Program parameters of a robot (JSON). /am-args <id> {"ore": "iron-ore"}
home-help=Set a robot's home where it stands. /am-home <id>
unknown-program=No program "__1__". Publish it: /c remote.call("automaton", "publish", "name", [[source]])
program-started=__1__: started "__2__" v__3__.
bad-args=Parameters must be JSON: __1__
greeting=Automaton is loaded. Hello, __1__!
hello=Automaton works! Command used __1__ times on this map.
command-help=Check that the Automaton mod is working.
debug-give-help=Debug: give worker automatons. /am-give [count], 5 by default.
debug-given=Given automatons: __1__.
debug-admin-only=Debug commands are for admins only in multiplayer.
debug-goto-help=Debug: send automatons. /am-goto <number|all> [x y] — to a point; without coordinates — to the building under the cursor or to you.
debug-goto-sent=Automatons sent: __1__.
debug-unknown-robot=No automaton __1__ on this surface.
debug-info-help=Debug: automaton state. /am-info <number>
debug-say-help=Debug: speech bubble over an automaton. /am-say <number> <text>
debug-look-help=Debug: state of the building under the cursor, as automaton programs see it. /am-look
debug-do-help=Debug: automaton action. /am-do <number> <wait|mine|take|put|pickup|drop|give|repair|refuel> [item] [count]; the target is under the cursor.
move-arrived=__1__: arrived.
move-no-path=__1__: no path.
move-stuck=__1__: stuck.
move-no-fuel=__1__: out of fuel.
action-done=__1__: __2__ — done: __3__.
action-done-reason=__1__: __2__ — done: __3__ (__4__).
action-failed=__1__: __2__ — __3__ (done: __4__).

