[technology-description]
automaton-radio=Machines exchange messages at any distance and share work through the board and task queues.
automaton-display=A pixel display programs can draw anything on.
automaton-tuning=Machines set assembler recipes themselves.
automaton-fluids=Machines carry fluids in a tank: water from lakes, oil from fields.
automaton-construction=Machines build, deconstruct and rotate buildings.
automaton-circuits=Markers connect to wires: programs read and write signals.
automaton-sensors=Machines see farther.
automaton-mk2=Electric model: faster, more cargo and memory, recharges at a station.
automaton-mk3=The best ground model.
automaton-combat=Machines that guard routes and attack nests.
automaton-flying=They fly straight, without colliding with buildings.

automaton-speed=Machines move faster.
automaton-cargo=More cargo slots for every machine.
automaton-mining=Machines mine faster.
automaton-processor=Machine programs run more instructions per tick.
automaton-memory=Machine programs get more memory.
automaton-tank=More fluid in the tank.