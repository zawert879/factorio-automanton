[item-description]
automaton-marker=A named flag: programs find it with marker("name").
automaton-programmer=Left-drag a box to create a named zone: programs find it with zone("name"). With Shift — remove zones.\nRight-drag over machines to choose a program for all of them. With Shift — stop them.
automaton-worker-mk1=A clockwork worker that follows its program: mines, carries and loads buildings.
automaton-worker-mk2=Electric: faster, more cargo, tank and memory. Recharges at a station (charge).
automaton-worker-mk3=The best ground model. Recharges at a station (charge).
automaton-charging-station=Stores energy from the grid and recharges Mk2 and Mk3 automatons next to it (charge).
automaton-display-small=A 3×2 pixel screen: programs draw on it from any distance — display("name").
automaton-display-large=A 6×4 pixel screen: programs draw on it from any distance — display("name").
automaton-signal-marker=A marker you can connect with wires: programs read network signals and output their own — signals.read(marker("name"), "signal-A").
automaton-combat-mk1=A machine gun on an automaton chassis: guards posts and routes (attack, guard, patrol). Ammo — reload from cargo.
automaton-combat-mk2=A rocket launcher on an automaton chassis: for nests and worms. Rockets — reload from cargo.
automaton-flyer-mk1=A hauler: flies straight, collides with nothing. Does not mine or carry fluids. Battery — recharges at a station.
automaton-flyer-mk2=A faster hauler with more cargo. Battery — recharges at a station.

